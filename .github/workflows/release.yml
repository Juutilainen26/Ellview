name: Release

# v로 시작하는 태그를 푸시하면 Windows exe를 빌드해서 GitHub Releases에 올립니다.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: 태그와 코드 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CODE=$(python -c "import ellview;print(ellview.__version__)")
          TAG=${GITHUB_REF_NAME#v}
          echo "code=$CODE tag=$TAG"
          test "$CODE" = "$TAG" || (echo "ellview/__init__.py의 __version__을 $TAG로 올려주세요" && exit 1)

      - name: 테스트
        run: python -m pytest -q

      - name: 빌드
        run: python scripts/build.py

      - name: 빌드된 exe 실행 확인
        shell: pwsh
        run: |
          $env:ELLVIEW_DATA_DIR = "$env:RUNNER_TEMP\ellview_smoke"
          python -c "import sys; sys.path.insert(0,'tests'); from samples import build_library; build_library(r'$env:RUNNER_TEMP\lib')"
          foreach ($f in @("03_comic.cbz", "04_seven.7z", "08_rar.cbr", "07_formats")) {
            Remove-Item -Recurse -Force $env:ELLVIEW_DATA_DIR -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "dist\Ellview\Ellview.exe" -ArgumentList "`"$env:RUNNER_TEMP\lib\$f`"", "--smoke-test" -Wait -PassThru
            $j = Get-Content "$env:ELLVIEW_DATA_DIR\smoke.json" -Raw -Encoding utf8 | ConvertFrom-Json
            Write-Host "$f -> pages=$($j.pages) first_ok=$($j.first_ok)"
            if (-not $j.first_ok) { throw "$f 열기 실패" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Ellview-win64
          path: dist/Ellview-*-win64.zip

      - name: GitHub Release 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ellview-*-win64.zip
          generate_release_notes: true
